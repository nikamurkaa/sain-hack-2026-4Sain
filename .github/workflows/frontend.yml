name: Проверка браузерного клиента
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/rehearse_client.py'
      - 'scripts/client_access.py'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read
jobs:
  offline-client:
    runs-on: ubuntu-latest
    env:
      SAIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR source checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          SAIN_SCREENSHOTS: evidence
      - run: npm run e2e
        working-directory: frontend
        env:
          SAIN_BROWSER: firefox
      - uses: actions/upload-artifact@v4
        with:
          name: sain-client
          path: |
            frontend/dist
            frontend/serve.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screens
          path: |
            frontend/evidence
            frontend/test-results
          if-no-files-found: warn
