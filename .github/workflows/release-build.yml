name: Release candidate fast client build
on:
  push:
    branches:
      - 'release/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Unit tests and production build
        working-directory: frontend
        run: npm ci --no-audit && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sain-client-candidate
          path: |
            frontend/dist
            frontend/serve.py
          retention-days: 7
