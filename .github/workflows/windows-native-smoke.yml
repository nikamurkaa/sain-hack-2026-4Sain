name: Native Windows launcher smoke
on:
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/build_windows_candidate.py'
      - 'macos/**'
      - 'scripts/build_macos_candidate.py'
      - '.github/workflows/windows-native-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SAIN_CI: '1'
      LLM_API_KEY: ''
      SAIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source SHA
        shell: pwsh
        env:
          SAIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SAIN_SOURCE_SHA) { throw 'Wrong checked-out commit' }
      - name: Verify Windows PowerShell 5.1 parser against every launcher script
        shell: powershell
        run: |
          Get-ChildItem windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse failed: $($_.Name) - $($errors -join '; ')" }
          }
      - name: Build real Windows distribution
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          $env:SAIN_PACKAGE_LIVE = '1'
          python scripts/build_windows_candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'ZIP build failed' }
      - name: Unpack into path with spaces and launch REHEARSAL end to end
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'SAIN Live Native Test'
          Expand-Archive -LiteralPath 'SAIN-Smart-Room-Live-AI-Windows.zip' -DestinationPath $dest -Force
          $info = Get-Content -LiteralPath (Join-Path $dest 'BUILD_INFO.txt') -Raw
          if (-not $info.Contains('Windows Live AI Demo')) { throw 'LIVE archive has wrong BUILD_INFO label' }
          try {
            & (Join-Path $dest 'START.cmd') -SelectedMode 1 -NoBrowser -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "START.cmd failed with exit code $LASTEXITCODE" }
            $index = Invoke-WebRequest 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 15
            if ($index.StatusCode -ne 200) { throw 'Frontend did not start' }
            $api = Invoke-WebRequest 'http://127.0.0.1:8765/openapi.json' -UseBasicParsing -TimeoutSec 15
            if ($api.StatusCode -ne 200) { throw 'FastAPI did not start' }
          }
          finally {
            # The job has no real secrets and runs REHEARSAL only.
            # Show the actual Python startup traceback if startup fails.
            foreach ($log in @('.runtime/rehearsal.err', '.runtime/client.err')) {
              $path = Join-Path $dest $log
              if (Test-Path -LiteralPath $path) {
                Write-Host "Diagnostic: $log"
                Get-Content -LiteralPath $path -Tail 55
              }
            }
            & (Join-Path $dest 'STOP.cmd')
            if ($LASTEXITCODE -ne 0) { throw 'STOP.cmd failed' }
          }
          Start-Sleep -Seconds 2
          foreach ($port in @(4173,8765)) {
            $tcp = New-Object System.Net.Sockets.TcpClient
            try { $tcp.Connect('127.0.0.1', $port); throw "Port $port left open after STOP.cmd" }
            catch [System.Net.Sockets.SocketException] { }
            finally { $tcp.Dispose() }
          }
      - name: LIVE without key fails closed (no fake fallback)
        shell: powershell
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'SAIN Live Native Test'
          $env:LLM_API_KEY = ''
          # An expected failed native process writes to stderr. In Windows
          # PowerShell 5.1 -ErrorActionPreference Stop that is surfaced as a
          # NativeCommandError before we can assert the exit code.
          $original = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            & (Join-Path $dest 'START.cmd') -SelectedMode 3 -NoBrowser -NonInteractive 2>$null
            $exit = $LASTEXITCODE
          } finally { $ErrorActionPreference = $original }
          if ($exit -eq 0) { throw 'LIVE launch succeeded without provider key' }
          $tcp = New-Object System.Net.Sockets.TcpClient
          try { $tcp.Connect('127.0.0.1', 8765); throw 'LIVE without key started backend' }
          catch [System.Net.Sockets.SocketException] { }
          finally { $tcp.Dispose() }
          # This failed native command was intentionally tested above. GitHub
          # Actions' Windows PowerShell wrapper otherwise returns its exit code.
          $global:LASTEXITCODE = 0

      - name: LIVE backend starts with a fake local-only key and stops without provider access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'SAIN Live Native Test'
          $env:LLM_API_KEY = 'CI-FAKE-KEY-NOT-REAL'
          $env:LLM_MODEL = 'gpt-6-luna'
          # Never make a request to the real organizer provider in CI.
          $env:LLM_BASE_URL = 'http://127.0.0.1:9/v1'
          try {
            & (Join-Path $dest 'START.cmd') -SelectedMode 3 -NoBrowser -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw 'LIVE launcher failed with fake local config' }
            $api = Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 10
            if ($api.StatusCode -ne 200) { throw 'LIVE backend did not start' }
          } finally {
            & (Join-Path $dest 'STOP.cmd')
            if ($LASTEXITCODE -ne 0) { throw 'LIVE stop failed' }
            $env:LLM_API_KEY = ''
            $env:LLM_BASE_URL = ''
          }
          Start-Sleep -Seconds 2
          foreach ($port in @(4173,8765)) {
            $tcp = New-Object System.Net.Sockets.TcpClient
            try { $tcp.Connect('127.0.0.1', $port); throw "LIVE service left port $port open" }
            catch [System.Net.Sockets.SocketException] { }
            finally { $tcp.Dispose() }
          }
