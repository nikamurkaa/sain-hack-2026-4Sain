name: Native macOS demo and package
on:
  pull_request:
    paths:
      - 'macos/**'
      - 'scripts/build_macos_candidate.py'
      - 'scripts/build_windows_candidate.py'
      - 'backend/**'
      - 'frontend/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/macos-native-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-native:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SAIN_CI: '1'
      LLM_API_KEY: ''
      SAIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify SHA and record native architecture
        run: |
          uname -a
          test "$(git rev-parse HEAD)" = "$SAIN_SOURCE_SHA"
      - name: Build, package and verify checksums
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
          python scripts/build_macos_candidate.py
          unzip -t SAIN-Smart-Room-macOS.zip
          shasum -a 256 -c SAIN-Smart-Room-macOS.zip.sha256
      - name: Unpack, launch, issue guest, stop and restart
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/SAIN macOS Native Test"
          mkdir -p "$DEST"
          unzip -q SAIN-Smart-Room-macOS.zip -d "$DEST"
          cd "$DEST"
          trap 'bash STOP.command || true' EXIT
          bash CHECK_ENV.command
          bash START.command
          python - <<'PY'
          import json, urllib.request
          assert urllib.request.urlopen('http://127.0.0.1:8765/health').status == 200
          assert '<div id="root">' in urllib.request.urlopen('http://127.0.0.1:4173/').read().decode()
          req=urllib.request.Request('http://127.0.0.1:8765/api/v1/sessions',
              data=json.dumps({'source':'dev','stay_id':'stay_test'}).encode(),
              headers={'Authorization':'Bearer offline-team','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req) as res:
              assert res.status == 201
              token=json.load(res)['session_token']
          req=urllib.request.Request('http://127.0.0.1:4173/api/v1/session',
              headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req) as res:
              assert res.status == 200
              assert json.load(res)['source'] == 'dev'
          PY
          bash STOP.command
          sleep 2
          python - <<'PY'
          import socket
          for port in (8765,4173):
              with socket.socket() as s:
                  s.settimeout(1)
                  assert s.connect_ex(('127.0.0.1',port)) != 0, f'Port still open: {port}'
          PY
          bash START.command
          curl -fsS http://127.0.0.1:8765/health >/dev/null
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          bash STOP.command
      - name: Native macOS crash-safe session and simulator persistence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/SAIN macOS Native Test"
          .venv/bin/python -m scripts.check_persistence_process
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sain-macos-demo
          path: |
            SAIN-Smart-Room-macOS.zip
            SAIN-Smart-Room-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 30
