name: Build portable Windows demo
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'windows/**'
      - 'scripts/build_windows_candidate.py'
      - 'docs/WINDOWS_ACCEPTANCE_GUIDE_RU.md'
      - 'docs/stage1/integration/**'
      - '.github/workflows/windows-package.yml'
  push:
    tags: ['v*-hackathon']
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: ubuntu-latest
    env:
      SAIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact release source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, unit test and build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Build portable ZIP with checksums
        run: python scripts/build_windows_candidate.py
      - name: Build LIVE AI Windows ZIP (no credentials bundled)
        run: SAIN_PACKAGE_LIVE=1 python scripts/build_windows_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: sain-windows-demo
          path: |
            SAIN-Smart-Room-Portfolio-Windows.zip
            SAIN-Smart-Room-Portfolio-Windows.zip.sha256
            SAIN-Smart-Room-Live-AI-Windows.zip
            SAIN-Smart-Room-Live-AI-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30
