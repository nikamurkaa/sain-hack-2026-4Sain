name: Python backend and offline scenario
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.check_offline
      - name: Offline /run under 1 CPU and 512 MiB
        run: |
          python - <<'PY'
          import os
          import resource
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          limit = 512 * 1024 * 1024
          resource.setrlimit(resource.RLIMIT_AS, (limit, limit))
          from scripts.check_offline import main
          raise SystemExit(main())
          PY
