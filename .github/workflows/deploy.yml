# Деплой бэкенда команды team25 на стенд хакатона Sain x Школа 21.
# Положите файл в .github/workflows/deploy.yml и заведите один секрет репозитория STAND_SSH_KEY:
# всё содержимое файла id_ed25519 из набора команды. Адрес стенда и его ключ хоста уже прописаны ниже.
# Бэкенд после деплоя: https://team25.hack.be-healthy.tech
# Секреты STAND_HOST и STAND_KNOWN_HOSTS не нужны; заводите их, только если попросят организаторы.
name: Деплой на стенд хакатона

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hackathon-stand-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.check_offline

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Настроить SSH
        env:
          STAND_SSH_KEY: ${{ secrets.STAND_SSH_KEY }}
          STAND_KNOWN_HOSTS: ${{ secrets.STAND_KNOWN_HOSTS }}
        run: |
          if [ -z "$STAND_SSH_KEY" ]; then
            echo "Нет секрета STAND_SSH_KEY: заведите его (содержимое id_ed25519 из набора команды)" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAND_SSH_KEY" > ~/.ssh/stand_key
          chmod 600 ~/.ssh/stand_key
          if [ -n "$STAND_KNOWN_HOSTS" ]; then
            printf '%s\n' "$STAND_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          hack.be-healthy.tech ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWfiX3RbhPXwr0/zVNMpnXeOXA1U9jSRSyvWgxIYus5
          hack.be-healthy.tech ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGAyx9VOzd3sR26Gz3Kn2qVci99YCbiLNZVEVs1ssB5UkW+h6NyKQ8Ybdjpy8nr9gleNMfAlS5hQvGBLXP8+yzs=
          hack.be-healthy.tech ssh-rsa 
          KNOWN_HOSTS
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Отправить код и собрать на стенде
        env:
          STAND_HOST: ${{ secrets.STAND_HOST || 'hack.be-healthy.tech' }}
        run: |
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/stand_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            "deploy@$STAND_HOST" "deploy $GITHUB_SHA"

      - name: Проверить SHA, доступность и валидацию запросов
        env:
          STAND_HOST: ${{ secrets.STAND_HOST || 'hack.be-healthy.tech' }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          sha = os.environ["GITHUB_SHA"]
          status = subprocess.run(
              ["ssh", "-i", os.path.expanduser("~/.ssh/stand_key"),
               "-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=yes",
               "-o", "IdentitiesOnly=yes", "-o", "ConnectTimeout=15",
               "deploy@" + os.environ["STAND_HOST"], "status"],
              check=True, capture_output=True, text=True, timeout=30,
          )
          assert sha in status.stdout, "SSH status does not confirm expected SHA"
          print("SSH status confirms deployed SHA:", sha)

          base = "https://team25.hack.be-healthy.tech"
          for path, bearer, expected_code, expected_body in [
              ("/", False, 200, {"team": "team25", "status": "ok"}),
              ("/health", False, 200, {"team": "team25", "status": "ok"}),
              ("/run", False, 401, None),
              ("/run", True, 422, None),
          ]:
              for attempt in range(5):
                  try:
                      headers = {"Content-Type": "application/json"}
                      if bearer:
                          headers["Authorization"] = "Bearer smoke-test"
                      body = json.dumps({"case": 1 if bearer else 2, "dataset_code": "smoke-test"}).encode() if path == "/run" else None
                      request = urllib.request.Request(base + path, data=body, headers=headers)
                      try:
                          response = urllib.request.urlopen(request, timeout=20)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          code = response.status
                          result = json.load(response)
                      assert code == expected_code, f"Unexpected HTTP {code} for {path}"
                      if expected_body is not None:
                          assert result == expected_body, f"Unexpected JSON for {path}"
                      print(path, "with Bearer" if bearer else "without Bearer", code, json.dumps(expected_body, ensure_ascii=False))
                      break
                  except (OSError, ValueError, AssertionError):
                      if attempt == 4:
                          raise
                      time.sleep(3)
          PYTHON
