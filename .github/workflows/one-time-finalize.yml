name: One-time portfolio branch finalization
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
  actions: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'FINALIZE_REPOSITORY')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify merged PR and clean source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/13 --jq '.merged')" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open" --jq 'length')" = "0"
          test ! -e .github/workflows/deploy.yml
          test -f frontend/src/main.tsx
          test -f tests/test_final_score_gate.py
          test -f docs/screenshots/desktop-room.png
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify complete backup and unchanged historic branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sain-backup
          gh run download 45014683225 --repo "$GITHUB_REPOSITORY" --name sain-all-branches-git-rescue --dir /tmp/sain-backup
          (cd /tmp/sain-backup && sha256sum -c bundle.sha256)
          git bundle verify /tmp/sain-backup/SAIN-Smart-Room-All-Branches.bundle
          python - <<'PY'
          import pathlib, subprocess
          lines=pathlib.Path('/tmp/sain-backup/branch_sha_inventory.txt').read_text().splitlines()
          archived={name:sha for name,sha in (line.split() for line in lines)}
          remote=subprocess.check_output(['git','ls-remote','--heads','origin'],text=True)
          for row in remote.splitlines():
              sha,ref=row.split()
              branch=ref.removeprefix('refs/heads/')
              if branch=='main': continue
              if branch=='release/sain-final-candidate-20261120':
                  assert subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD']).returncode==0, 'release not merged'
              else:
                  assert archived.get('origin/'+branch)==sha, 'unbacked or changed branch: '+branch
          print('All remote branch histories are backed up or merged into main')
          PY
      - name: Remove one-time workflow from final main commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-finalize.yml
          git commit -m "chore: remove one-time GitHub finalization workflow"
          git push origin HEAD:refs/heads/main
      - name: Tag final main and delete archived branches without force
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin 'refs/tags/v1.0.0-hackathon'; then
            echo 'Archive tag already exists; refusing to overwrite' >&2
            exit 1
          fi
          git tag -a v1.0.0-hackathon -m "SAIN Smart Room · 4Sain · hackathon portfolio archive"
          git push origin refs/tags/v1.0.0-hackathon
          git ls-remote --heads origin | sed 's|.*refs/heads/||' | sort > /tmp/heads-before-cleanup.txt
          while IFS= read -r branch; do
            if [ "$branch" != "main" ]; then git push origin --delete "$branch"; fi
          done < /tmp/heads-before-cleanup.txt
          git ls-remote --heads origin | sed 's|.*refs/heads/||' > /tmp/heads-after-cleanup.txt
          test "$(cat /tmp/heads-after-cleanup.txt)" = "main"
          git rev-parse HEAD > /tmp/portfolio-main-sha.txt
      - name: Dispatch full CI and reproducible Windows build on final SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run test.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run frontend.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run windows-package.yml --ref main --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-branch-finalization-evidence
          path: |
            /tmp/portfolio-main-sha.txt
            /tmp/heads-before-cleanup.txt
            /tmp/heads-after-cleanup.txt
          if-no-files-found: warn
          retention-days: 90
