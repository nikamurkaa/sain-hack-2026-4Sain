name: React TypeScript browser regression
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'main.py'
      - 'backend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/rehearse_client.py'
      - 'scripts/client_access.py'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-client:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      SAIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - name: Node unit tests, TypeScript, Vite production build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          SAIN_SCREENSHOTS: evidence
      - run: npm run e2e
        working-directory: frontend
        env:
          SAIN_BROWSER: firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screens
          path: |
            frontend/evidence
            frontend/test-results
          if-no-files-found: warn
          retention-days: 10
