name: One-time prune of safely merged branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-prune-once.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact branch heads, ancestry and no open PRs; delete only two merged refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/stage4/premium-ui-ux:refs/remotes/origin/stage4/premium-ui-ux' \
            '+refs/heads/release/final-technical-completion:refs/remotes/origin/release/final-technical-completion'
          for entry in \
            'stage4/premium-ui-ux 5da4b738db37ffbcdd7cc11908a2c0e3c2140b8a' \
            'release/final-technical-completion 97fb4ef9652435a399134298282297a8d4415e8a'; do
            read -r branch expected <<< "$entry"
            actual="$(git rev-parse "refs/remotes/origin/$branch")"
            test "$actual" = "$expected" || { echo "::error::Branch head changed: $branch"; exit 1; }
            git merge-base --is-ancestor "$actual" 'refs/remotes/origin/main' || { echo "::error::Unmerged commits in $branch"; exit 1; }
            count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq length)"
            test "$count" = 0 || { echo "::error::Open PR for $branch"; exit 1; }
            echo "VERIFIED: $branch is fully in main, unchanged, no open PR"
          done
          for branch in stage4/premium-ui-ux release/final-technical-completion; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "DELETED: $branch"
          done